<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parfum des Tages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1ea;
    --bg-2: #efe6da;
    --card: rgba(255, 255, 255, 0.72);
    --ink: #2a2320;
    --muted: #8a7d72;
    --line: rgba(42, 35, 32, 0.12);
    --gold: #b08d57;
    --gold-2: #d8b77e;
    --rose: #c98d8d;
    --shadow: 0 30px 60px -30px rgba(60, 40, 20, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15110f;
      --bg-2: #1e1815;
      --card: rgba(36, 29, 25, 0.75);
      --ink: #f3ebe1;
      --muted: #a39486;
      --line: rgba(243, 235, 225, 0.12);
      --shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Inter", system-ui, sans-serif;
    font-weight: 300;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(216, 183, 126, 0.25), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, rgba(201, 141, 141, 0.22), transparent 60%),
      linear-gradient(160deg, var(--bg), var(--bg-2));
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    padding: 48px 16px 64px;
  }

  main { width: 100%; max-width: 560px; }

  header { text-align: center; margin-bottom: 36px; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
  }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: clamp(40px, 9vw, 58px);
    line-height: 1.05;
    margin: 10px 0 8px;
    letter-spacing: -0.01em;
  }
  h1 em { color: var(--gold); }
  .date { color: var(--muted); font-size: 14px; }

  .card {
    background: var(--card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 28px;
  }

  /* Bühne */
  .stage {
    position: relative;
    text-align: center;
    padding: 40px 20px 36px;
    overflow: hidden;
  }
  .bottle {
    width: 64px;
    height: 88px;
    margin: 0 auto 22px;
    position: relative;
    transition: transform 0.4s ease;
  }
  .bottle svg { width: 100%; height: 100%; overflow: visible; }
  .stage.spinning .bottle { animation: shake 0.18s ease-in-out infinite alternate; }
  .stage.revealed .bottle { animation: pop 0.7s cubic-bezier(.2,1.6,.4,1); }

  .result {
    min-height: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .result-label {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    height: 14px;
  }
  .result-name {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(30px, 7vw, 42px);
    line-height: 1.1;
    font-weight: 600;
    word-break: break-word;
  }
  .result-name.placeholder { color: var(--muted); font-weight: 400; font-style: italic; font-size: 26px; }
  .stage.spinning .result-name { filter: blur(1.2px); opacity: 0.75; }
  .stage.revealed .result-name {
    animation: reveal 0.9s cubic-bezier(.2,.8,.2,1);
    background: linear-gradient(90deg, var(--gold), var(--rose), var(--gold));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: reveal 0.9s cubic-bezier(.2,.8,.2,1), shimmer 4s linear 0.9s infinite;
  }

  .spark {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    left: 50%; top: 45%;
    animation: burst 1.1s ease-out forwards;
  }

  .go {
    margin-top: 30px;
    appearance: none;
    border: none;
    cursor: pointer;
    font: inherit;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    padding: 20px 44px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--gold), var(--rose));
    box-shadow: 0 14px 30px -10px rgba(176, 141, 87, 0.7), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s;
    position: relative;
    overflow: hidden;
  }
  .go::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.45) 50%, transparent 70%);
    transform: translateX(-120%);
    transition: transform 0.7s ease;
  }
  .go:hover { transform: translateY(-2px); box-shadow: 0 20px 38px -12px rgba(176, 141, 87, 0.8); }
  .go:hover::after { transform: translateX(120%); }
  .go:active { transform: translateY(0) scale(0.98); }
  .go:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .go:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

  /* Liste */
  .list-card { margin-top: 22px; }
  .list-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 16px;
  }
  h2 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
  }
  .count { color: var(--muted); font-size: 13px; }

  form { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(176, 141, 87, 0.15); }
  .add {
    appearance: none;
    font: inherit;
    font-weight: 500;
    font-size: 14px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--bg);
    border-radius: 14px;
    padding: 0 20px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .add:hover { opacity: 0.85; }

  ul { list-style: none; padding: 0; margin: 18px 0 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-top: 1px solid var(--line);
    animation: slideIn 0.35s ease;
  }
  li:first-child { border-top: none; }
  li.active .name { color: var(--gold); font-weight: 500; }
  li.active .dot { background: var(--gold); box-shadow: 0 0 0 4px rgba(176,141,87,0.2); }
  li.removing { animation: slideOut 0.25s ease forwards; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .name { flex: 1; font-size: 15px; word-break: break-word; transition: color 0.15s; }
  .del {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    opacity: 0.5;
    transition: opacity 0.2s, background 0.2s, color 0.2s;
  }
  li:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: rgba(201, 141, 141, 0.15); color: var(--rose); }

  .empty {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    font-family: "Cormorant Garamond", serif;
    font-size: 19px;
    padding: 22px 0 6px;
  }

  footer { text-align: center; margin-top: 28px; color: var(--muted); font-size: 12px; letter-spacing: 0.05em; }

  @keyframes shake {
    from { transform: rotate(-7deg) translateY(0); }
    to   { transform: rotate(7deg) translateY(-3px); }
  }
  @keyframes pop {
    0% { transform: scale(0.8); }
    100% { transform: scale(1); }
  }
  @keyframes reveal {
    0% { opacity: 0; transform: translateY(14px) scale(0.92); letter-spacing: 0.2em; filter: blur(6px); }
    100% { opacity: 1; transform: none; letter-spacing: normal; filter: blur(0); }
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  @keyframes burst {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.2); opacity: 0; }
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes slideOut { to { opacity: 0; transform: translateX(20px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Signature Scent</div>
    <h1>Parfum <em>des</em> Tages</h1>
    <div class="date" id="date"></div>
  </header>

  <section class="card stage" id="stage" aria-live="polite">
    <div class="bottle" aria-hidden="true">
      <svg viewBox="0 0 64 88">
        <defs>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e9d3a8"/>
            <stop offset="1" stop-color="#c98d8d"/>
          </linearGradient>
        </defs>
        <rect x="24" y="2" width="16" height="12" rx="3" fill="#b08d57"/>
        <rect x="27" y="14" width="10" height="8" fill="#d8b77e"/>
        <rect x="6" y="22" width="52" height="62" rx="14" fill="url(#glass)" opacity="0.9"/>
        <rect x="12" y="30" width="8" height="40" rx="4" fill="#fff" opacity="0.35"/>
        <rect x="20" y="46" width="24" height="14" rx="2" fill="#fff" opacity="0.55"/>
      </svg>
    </div>
    <div class="result">
      <div class="result-label" id="resultLabel"></div>
      <div class="result-name placeholder" id="resultName">Welcher Duft darf es heute sein?</div>
    </div>
    <button class="go" id="go">Duft wählen</button>
  </section>

  <section class="card list-card">
    <div class="list-head">
      <h2>Meine Düfte</h2>
      <span class="count" id="count"></span>
    </div>
    <form id="form" autocomplete="off">
      <input type="text" id="input" placeholder="z. B. Chanel N°5" maxlength="80" aria-label="Neuer Duft">
      <button class="add" type="submit">Hinzufügen</button>
    </form>
    <ul id="list"></ul>
  </section>

  <footer>Deine Liste wird lokal in diesem Browser gespeichert.</footer>
</main>

<script>
  const STORE = "parfum-des-tages:list";
  const LAST = "parfum-des-tages:last";

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), go = $("go"), resultName = $("resultName"), resultLabel = $("resultLabel");
  const list = $("list"), form = $("form"), input = $("input"), count = $("count");

  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  let perfumes = load(STORE, []);
  let spinning = false;

  $("date").textContent = new Date().toLocaleDateString("de-DE", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });

  function render() {
    list.innerHTML = "";
    if (!perfumes.length) {
      list.innerHTML = '<li class="empty" style="border:none;display:block">Noch keine Düfte – trag deinen ersten ein.</li>';
    }
    perfumes.forEach((p, i) => {
      const li = document.createElement("li");
      li.dataset.index = i;
      li.innerHTML = '<span class="dot"></span><span class="name"></span><button class="del" aria-label="Entfernen">×</button>';
      li.querySelector(".name").textContent = p;
      li.querySelector(".del").addEventListener("click", () => remove(i, li));
      list.appendChild(li);
    });
    count.textContent = perfumes.length === 1 ? "1 Duft" : `${perfumes.length} Düfte`;
    go.disabled = perfumes.length === 0;
  }

  function remove(i, li) {
    if (spinning) return;
    li.classList.add("removing");
    setTimeout(() => { perfumes.splice(i, 1); save(STORE, perfumes); render(); }, 230);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = input.value.trim();
    if (!name) return;
    if (perfumes.some((p) => p.toLowerCase() === name.toLowerCase())) {
      input.select();
      return;
    }
    perfumes.push(name);
    save(STORE, perfumes);
    input.value = "";
    render();
    input.focus();
  });

  function highlight(i) {
    list.querySelectorAll("li").forEach((li) => li.classList.toggle("active", Number(li.dataset.index) === i));
  }

  function sparkle() {
    const colors = ["#b08d57", "#d8b77e", "#c98d8d", "#f0d9b5"];
    for (let k = 0; k < 26; k++) {
      const s = document.createElement("span");
      s.className = "spark";
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 120;
      s.style.setProperty("--x", Math.cos(angle) * dist + "px");
      s.style.setProperty("--y", Math.sin(angle) * dist + "px");
      s.style.background = colors[k % colors.length];
      s.style.animationDelay = Math.random() * 0.15 + "s";
      stage.appendChild(s);
      setTimeout(() => s.remove(), 1400);
    }
  }

  function pick() {
    if (spinning || !perfumes.length) return;
    spinning = true;
    go.disabled = true;
    stage.classList.remove("revealed");
    stage.classList.add("spinning");
    resultName.classList.remove("placeholder");
    resultLabel.textContent = "";

    // Vermeide nach Möglichkeit denselben Duft wie beim letzten Mal
    const last = load(LAST, null);
    let pool = perfumes.map((_, i) => i);
    if (perfumes.length > 1) pool = pool.filter((i) => perfumes[i] !== last);
    const target = pool[Math.floor(Math.random() * pool.length)];

    const steps = 22 + Math.floor(Math.random() * 6);
    let step = 0, idx = Math.floor(Math.random() * perfumes.length);

    const tick = () => {
      step++;
      if (step >= steps) idx = target;
      else idx = perfumes.length > 1 ? (idx + 1 + Math.floor(Math.random() * (perfumes.length - 1))) % perfumes.length : 0;

      resultName.textContent = perfumes[idx];
      highlight(idx);

      if (step < steps) {
        // langsamer werdend (ease-out)
        const t = step / steps;
        setTimeout(tick, 45 + Math.pow(t, 3) * 320);
      } else {
        finish(target);
      }
    };
    tick();
  }

  function finish(i) {
    stage.classList.remove("spinning");
    void stage.offsetWidth; // Animation neu starten
    stage.classList.add("revealed");
    resultLabel.textContent = "Heute trägst du";
    resultName.textContent = perfumes[i];
    highlight(i);
    sparkle();
    save(LAST, perfumes[i]);
    spinning = false;
    go.disabled = false;
    go.textContent = "Nochmal wählen";
  }

  go.addEventListener("click", pick);
  render();
</script>
</body>
</html>
